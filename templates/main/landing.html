<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Happy Healthy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .mobile-container {
            max-width: 400px;
            margin: 0 auto;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="mobile-container flex items-center justify-center p-6">
        <div class="w-full">
            <!-- Logo/Header -->
            <div class="text-center mb-12 mt-8">
                <div class="inline-flex h-16 w-16 items-center justify-center rounded-3xl bg-white/15 text-white mb-4">
                    <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M8 3v4" />
                        <path d="M16 3v4" />
                        <path d="M4 11h16" />
                        <rect x="4" y="5" width="16" height="16" rx="3" />
                        <path d="M12 13v4" />
                        <path d="M10 15h4" />
                    </svg>
                </div>
                <h1 class="text-3xl sm:text-4xl font-bold text-white mb-2">Happy Healthy</h1>
                <p class="text-blue-100 text-sm">Your Drug Safety Companion</p>
            </div>

            <!-- Welcome Card -->
            <div class="bg-white rounded-3xl shadow-2xl p-8 mb-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-2 text-center">Welcome!</h2>
                <p class="text-gray-600 text-center mb-8">Choose how you'd like to continue</p>

                <!-- Guest Button -->
                <a href="{% url 'guest_continue' %}" 
                   class="block w-full bg-gradient-to-r from-gray-500 to-gray-600 hover:from-gray-600 hover:to-gray-700 text-white px-6 py-4 rounded-xl font-semibold transition transform hover:scale-105 text-center mb-4 shadow-lg">
                    <div class="flex items-center justify-center gap-3">
                        <span class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-white/15">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M20 21a8 8 0 1 0-16 0"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <span>Continue as Guest</span>
                    </div>
                    <p class="text-xs mt-1 opacity-90">Quick access, limited features</p>
                </a>

                <!-- Login Button -->
                <a href="{% url 'login' %}" 
                   class="block w-full bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white px-6 py-4 rounded-xl font-semibold transition transform hover:scale-105 text-center mb-4 shadow-lg">
                    <div class="flex items-center justify-center gap-3">
                        <span class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-white/15">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <span>Login</span>
                    </div>
                    <p class="text-xs mt-1 opacity-90">Access your saved data</p>
                </a>

                <!-- Register Button -->
                <a href="{% url 'register' %}" 
                   class="block w-full bg-gradient-to-r from-purple-500 to-purple-600 hover:from-purple-600 hover:to-purple-700 text-white px-6 py-4 rounded-xl font-semibold transition transform hover:scale-105 text-center shadow-lg">
                    <div class="flex items-center justify-center gap-3">
                        <span class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-white/15">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M12 20h9"></path>
                                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
                            </svg>
                        </span>
                        <span>Create Account</span>
                    </div>
                    <p class="text-xs mt-1 opacity-90">Patient or Caregiver</p>
                </a>
            </div>

            <!-- Features Preview -->
            <div class="bg-white bg-opacity-20 backdrop-blur-sm rounded-2xl p-6 text-white">
                <h3 class="font-semibold mb-3 text-center">What you can do:</h3>
                <div class="grid grid-cols-2 gap-3 text-sm">
                    <div class="text-center">
                        <div class="inline-flex h-10 w-10 items-center justify-center rounded-2xl bg-white/15 mb-1">
                            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="11" cy="11" r="7"></circle>
                                <path d="m20 20-3.5-3.5"></path>
                            </svg>
                        </div>
                        <div>Search Drugs</div>
                    </div>
                    <div class="text-center">
                        <div class="inline-flex h-10 w-10 items-center justify-center rounded-2xl bg-white/15 mb-1">
                            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M12 9v4"></path>
                                <path d="M12 17h.01"></path>
                                <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                            </svg>
                        </div>
                        <div>Check Interactions</div>
                    </div>
                    <div class="text-center">
                        <div class="inline-flex h-10 w-10 items-center justify-center rounded-2xl bg-white/15 mb-1">
                            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                                <path d="M17 21v-8H7v8"></path>
                                <path d="M7 3v5h8"></path>
                            </svg>
                        </div>
                        <div>Save Favorites</div>
                    </div>
                    <div class="text-center">
                        <div class="inline-flex h-10 w-10 items-center justify-center rounded-2xl bg-white/15 mb-1">
                            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M3 3v18h18"></path>
                                <path d="M18 17V9"></path>
                                <path d="M13 17V5"></path>
                                <path d="M8 17v-3"></path>
                            </svg>
                        </div>
                        <div>Track History</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
